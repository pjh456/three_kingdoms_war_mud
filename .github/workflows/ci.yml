name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            cache_key: Linux-GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            ccache_variant: ccache
            cmake_args: "-DTKW_ENABLE_TUI=ON"
            ctest_args: ""
          - name: Linux (Clang)
            cache_key: Linux-Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            ccache_variant: ccache
            cmake_args: ""
            ctest_args: ""
          - name: Linux (Clang, ASan+UBSan)
            cache_key: Linux-Clang-ASan-UBSan
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            ccache_variant: ccache
            cmake_args: "-DCMAKE_BUILD_TYPE=Debug -DPJH_PLATFORM_SANITIZERS=ON"
            ctest_args: ""
          - name: macOS (Clang)
            cache_key: macOS-Clang
            os: macos-latest
            cc: clang
            cxx: clang++
            ccache_variant: ccache
            cmake_args: ""
            ctest_args: "-E cli_repl_raw_mode_smoke"
          # 钉 windows-2022：windows-latest 已升到 VS18（MSVC 14.51），其 STL 与项目
          # 钉定的 doctest 2.5.0 不兼容（前置声明 basic_ostream 与 <string_view> 冲突），
          # windows-2022 的 VS2022 工具链可正常编译 doctest，故保留测试目标的构建覆盖。
          - name: Windows (MSVC)
            cache_key: Windows-MSVC
            os: windows-2022
            cc: cl
            cxx: cl
            ccache_variant: ccache
            cmake_args: "-DTKW_ENABLE_TUI=ON"
            ctest_args: ""

    steps:
      # pjh_cli 子模块在 .gitmodules 里用 SSH 地址；CI 无部署密钥，统一重写成
      # HTTPS 后再让 checkout 拉取（其余子模块本就是 HTTPS）。
      - name: Rewrite SSH submodule URLs to HTTPS
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.cache_key }}
          variant: ${{ matrix.ccache_variant }}

      - name: Setup MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = vswhere -latest -property installationPath
          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object { Add-Content $env:GITHUB_ENV $_ }

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CMAKE_C_COMPILER_LAUNCHER: ${{ matrix.ccache_variant }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.ccache_variant }}
        run: cmake -B build -G Ninja ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --parallel

      # Windows 无 sh：shell/PTY E2E 已由 tests/CMakeLists.txt 的 if(UNIX) 门控跳过；
      # Windows 跑全部 doctest 目标、直跑二进制的 E2E，以及 TUI ON 时的 tui_panel_tests。
      # macOS 的 BSD script 不支持 `script -qec`，排除依赖它的 raw 冒烟用例。
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure --no-tests=error --repeat until-fail:3 ${{ matrix.ctest_args }}
